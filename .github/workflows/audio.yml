name: Record natural audio

# Records natural-voice audio for new lines (Punjabi, Marathi, Bengali) with the open-source AI4Bharat Indic Parler-TTS
# model and commits it. Free: runs on GitHub's servers, no account or key needed.
on:
  push:
    branches: [main]
    paths: ['src/languages/**', 'src/engine/script.ts', 'scripts/**', '.github/workflows/audio.yml']
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: audio
  cancel-in-progress: false

jobs:
  audio:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run audio:texts
      - name: Check what's missing
        id: check
        run: |
          missing=$(node -e "const fs=require('fs');const t=JSON.parse(fs.readFileSync('scripts/texts.json'));console.log(t.filter(x=>!fs.existsSync('public/audio/'+x.key+'.mp3')).length)")
          echo "missing=$missing" >> "$GITHUB_OUTPUT"
          echo "$missing lines need audio"
      - uses: actions/setup-python@v5
        if: steps.check.outputs.missing != '0'
        with:
          python-version: '3.11'
      - name: Install the voice model
        if: steps.check.outputs.missing != '0'
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install git+https://github.com/huggingface/parler-tts.git soundfile
      - uses: actions/cache@v4
        if: steps.check.outputs.missing != '0'
        with:
          path: ~/.cache/huggingface
          key: hf-indic-parler-tts
      - name: Record
        id: record
        if: steps.check.outputs.missing != '0'
        env:
          COMMIT: '1'
          BUDGET_MINUTES: '300'
        run: |
          git config user.name "boli-audio-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python scripts/gen_audio.py
      - name: Continue in a new run if there is more to record
        if: steps.record.outputs.remaining != '' && steps.record.outputs.remaining != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run audio.yml --ref main
